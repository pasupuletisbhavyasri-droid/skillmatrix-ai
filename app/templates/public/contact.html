{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="container py-5" style="margin-top: 5rem; max-width: 560px;">

    <div class="text-center mb-4">

        <span class="badge-pill">Contact</span>

        <h2 class="section-title">
            Get in Touch
        </h2>

        <p class="text-muted">
            Have a question or feedback?
            Send us a message.
        </p>

    </div>

    <div class="dashboard-panel glass-card">

        <form
            method="POST"
            action="{{ url_for('public.contact') }}"
        >

            <!-- CSRF TOKEN -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <!-- NAME -->
            <div class="mb-3">

                <label
                    for="name"
                    class="form-label small"
                >
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <!-- EMAIL -->
            <div class="mb-3">

                <label
                    for="email"
                    class="form-label small"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <!-- MESSAGE -->
            <div class="mb-4">

                <label
                    for="message"
                    class="form-label small"
                >
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    class="form-control"
                    rows="5"
                    placeholder="Enter your message"
                    required
                ></textarea>

            </div>

            <!-- SUBMIT -->
            <button
                type="submit"
                class="btn btn-gradient w-100"
            >
                <i class="fa-solid fa-paper-plane me-2"></i>
                Send Message
            </button>

        </form>

    </div>

</div>

{% endblock %}
